<article class="card" (click)="select.emit(pokemon)">
  <button
    class="fav-btn"
    [class.active]="isFavorite"
    (click)="onToggleFavorite($event)"
    [attr.aria-label]="isFavorite ? 'Quitar de favoritos' : 'Agregar a favoritos'"
  >
    <svg viewBox="0 0 24 24" width="18" height="18">
      <path
        d="M12 21s-6.716-4.35-9.428-8.06C.86 10.42 1.2 6.9 3.9 5.28c2.2-1.32 4.9-.66 6.1 1.3.4.65.6 1.02.6 1.02s.2-.37.6-1.02c1.2-1.96 3.9-2.62 6.1-1.3 2.7 1.62 3.04 5.14 1.328 7.66C18.716 16.65 12 21 12 21z"
        [attr.fill]="isFavorite ? 'currentColor' : 'none'"
        stroke="currentColor"
        stroke-width="1.6"
      />
    </svg>
  </button>

  <span class="card-id">{{ formattedId }}</span>

  <div class="card-image">
    <img [src]="pokemon.image" [alt]="pokemon.name" loading="lazy" />
  </div>

  <h3 class="card-name">{{ pokemon.name }}</h3>

  <div class="card-types">
    @for (type of pokemon.types; track type) {
      <span class="type-chip" [style.background]="typeColors[type] + '26'" [style.color]="typeColors[type]">
        {{ type }}
      </span>
    }
  </div>
</article>
